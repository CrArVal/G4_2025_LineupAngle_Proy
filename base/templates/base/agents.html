{% extends "base/menu.html" %}
{% load static %}
<link rel="stylesheet" href="{% static 'css/agents.css' %}">

{% block title %}Agentes | Lineup Angle{% endblock %}
{% block content %}
<style>
    /* FORZAMOS ESTILOS AQUÍ PARA ASEGURAR QUE SE VEA BIEN */
    .agent-card-custom {
        background-color: #182735;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        overflow: hidden;
        transition: transform 0.2s;
        cursor: pointer;
    }
    .agent-card-custom:hover {
        transform: translateY(-5px);
        border-color: #FF4655;
    }
    .agent-img-custom {
        width: 100%;
        height: 250px;
        object-fit: cover;
        border-bottom: 3px solid #FF4655;
    }
    
    /* ESTILOS DEL MODAL OSCURO */
    .modal-content-dark {
        background-color: #182735 !important; /* Fondo Oscuro */
        color: #f8f9fa !important; /* Texto Blanco */
        border: 1px solid #FF4655;
    }
    .modal-header-dark {
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .btn-close-white {
        filter: invert(1) grayscale(100%) brightness(200%); /* X blanca */
    }
    
    /* Iconos de habilidad blancos */
    .ability-icon-white {
        width: 40px;
        height: 40px;
        filter: brightness(0) invert(1); /* Convierte negro a blanco */
        margin-right: 10px;
    }
</style>

{% include "base/menu2.html" %}

<div class="container py-5">
    <div class="row mb-3">
        <div class="col-12">
            <h1 class="text-center fw-bold mb-5" style="color:#FF4655;">AGENTES Y ROLES</h1>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-md-6">
            <input id="searchInput" class="form-control" placeholder="Buscar agente..." style="background:#182735; color:white; border:1px solid #FF4655;">
        </div>
    </div>

    <div id="agentsGrid" class="row g-3">
        <div class="col-12 text-center">
            <div class="spinner-border text-danger" role="status"></div>
        </div>
    </div>
</div>

<div class="modal fade" id="agentModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered"> <div class="modal-content modal-content-dark">
            <div class="modal-header modal-header-dark">
                <h5 class="modal-title" id="agentModalTitle">Nombre Agente</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body" id="agentModalBody">
                </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // AQUI ESTA EL TRUCO: ?language=es-MX para español latino
    const API_ENDPOINT = "https://valorant-api.com/v1/agents?language=es-MX&isPlayableCharacter=true"; 
    
    const agentsGrid = document.getElementById('agentsGrid');
    const searchInput = document.getElementById('searchInput');
    let allAgents = []; // Guardamos los agentes aquí para el buscador

    // 1. Cargar Agentes
    async function loadAgents() {
        try {
            const resp = await fetch(API_ENDPOINT);
            const json = await resp.json();
            
            // Guardamos en la variable global y filtramos duplicados (Sova a veces sale 2 veces)
            allAgents = json.data.filter((agent, index, self) => 
                index === self.findIndex((t) => (t.displayName === agent.displayName))
            );

            renderAgents(allAgents);

        } catch (err) {
            console.error(err);
            agentsGrid.innerHTML = `<div class="alert alert-danger">Error al cargar API</div>`;
        }
    }

    // 2. Renderizar Tarjetas
    function renderAgents(agentsList) {
        agentsGrid.innerHTML = '';
        agentsList.forEach(agent => {
            const col = document.createElement('div');
            col.className = 'col-sm-6 col-md-4 col-lg-3 agent-col';
            
            // HTML de la Tarjeta
            col.innerHTML = `
                <div class="agent-card-custom h-100" onclick="openAgentModal('${agent.uuid}')">
                    <img src="${agent.displayIcon}" class="agent-img-custom" alt="${agent.displayName}">
                    <div class="p-3">
                        <h4 class="fw-bold" style="color: #FF4655;">${agent.displayName.toUpperCase()}</h4>
                        <span class="badge bg-secondary">${agent.role ? agent.role.displayName : 'Agente'}</span>
                        <p class="small mt-2 text-muted">${agent.description.substring(0, 80)}...</p>
                        <button class="btn btn-danger w-100 mt-2" style="background-color:#FF4655;">Ver Detalles</button>
                    </div>
                </div>
            `;
            agentsGrid.appendChild(col);
        });
    }

    // 3. Abrir Modal (Lógica corregida)
    window.openAgentModal = function(uuid) {
        const agent = allAgents.find(a => a.uuid === uuid);
        if (!agent) return;

        // Título
        document.getElementById('agentModalTitle').textContent = agent.displayName.toUpperCase();

        // Habilidades
        let abilitiesHtml = '';
        agent.abilities.forEach(abi => {
            if (abi.displayIcon) {
                abilitiesHtml += `
                    <div class="d-flex align-items-start mb-3 p-2" style="background: #0F1923; border-radius: 5px; border-left: 3px solid #FF4655;">
                        <img src="${abi.displayIcon}" class="ability-icon-white">
                        <div>
                            <strong style="color: #FF4655;">${abi.displayName}</strong>
                            <p class="small mb-0 text-light">${abi.description}</p>
                        </div>
                    </div>
                `;
            }
        });

        // Cuerpo del Modal (Diseño de 2 columnas: Izq Imagen, Der Info)
        document.getElementById('agentModalBody').innerHTML = `
            <div class="row">
                <div class="col-md-5 text-center d-flex align-items-center justify-content-center" style="background: radial-gradient(circle, #2a2a2a 0%, #182735 70%); border-radius: 10px;">
                    <img src="${agent.fullPortrait}" style="max-height: 500px; width: auto; max-width: 100%; filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));">
                </div>

                <div class="col-md-7 mt-3 mt-md-0">
                    <h5 class="text-light border-bottom pb-2">Rol: <span style="color:#FF4655">${agent.role ? agent.role.displayName : 'N/A'}</span></h5>
                    <p class="text-light mt-3">${agent.description}</p>
                    
                    <h5 class="text-light mt-4 border-bottom pb-2">Habilidades</h5>
                    <div class="mt-3" style="max-height: 300px; overflow-y: auto;">
                        ${abilitiesHtml}
                    </div>
                </div>
            </div>
        `;

        const modal = new bootstrap.Modal(document.getElementById('agentModal'));
        modal.show();
    }

    // 4. Buscador
    searchInput.addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = allAgents.filter(a => a.displayName.toLowerCase().includes(term));
        renderAgents(filtered);
    });

    // Iniciar
    loadAgents();
</script>

{% endblock %}

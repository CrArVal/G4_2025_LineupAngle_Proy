<!DOCTYPE html>
<html>
    <head>
        {% load static %}
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="{% static 'css/home.css' %}">
        <link rel="stylesheet" href="{% static 'css/menu.css' %}"> 
        <link rel="stylesheet" href="{% static 'css/registro.css' %}"> 
        

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    </head>
    <body>
<div class="container mt-4" 
     style="position: fixed; top: 80px; left: 50%; transform: translateX(-50%); z-index: 9999; width: 100%; max-width: 600px;">
    
    {% if messages %}
        {% for message in messages %}
            
            <div class="alert {% if message.tags == 'error' %}alert-danger border-danger{% else %}alert-success border-success{% endif %} alert-dismissible fade show shadow-lg border-0 border-start border-5" role="alert">
                
                <div class="d-flex align-items-center">
                    <strong class="me-2">
                        {% if message.tags == 'error' %}
                            <i class="bi bi-exclamation-triangle-fill"></i> Error:
                        {% else %}
                            <i class="bi bi-check-circle-fill"></i> Éxito:
                        {% endif %}
                    </strong> 
                    <span>{{ message }}</span>
                </div>
                
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

        {% endfor %}
    {% endif %}
</div>
     <!-- Incluimos el menú -->
    

    <!-- Contenido dinámico -->
    <main class="container" style="margin-top: 80px;">
    {% block content %}
    
    {% endblock %}
    </main>        
        
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        
    </body>
   
</html>

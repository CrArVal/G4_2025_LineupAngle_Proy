{% extends 'base/menu.html' %}
{% load static %}

{% block content %}

<div style="height: 100px;"></div>

<div class="container py-5" style="color: var(--texto-principal);">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="text-center mb-4">
                <img src="{% static 'images/mascotasin.png' %}" alt="Avatar" style="width: 150px; opacity: 0.8;">
            </div>

            <div class="card border-0" style="background-color: var(--superficie);">
                <div class="card-body p-4">

                    <h1 class="text-center fw-bold" style="color: var(--acento-secundario);">
                        Perfil de {{ user.username }}
                    </h1>

                    <hr style="color: var(--texto-secundario);">

                    <ul class="list-group list-group-flush">
                        <li class="list-group-item" style="background-color: transparent; color: var(--texto-principal);">
                            <strong>Email:</strong> {{ user.email }}
                        </li>
                        <li class="list-group-item" style="background-color: transparent; color: var(--texto-principal);">
                            <strong>Miembro desde:</strong> {{ user.date_joined|date:"d F, Y" }}
                        </li>
                        <li class="list-group-item" style="background-color: transparent; color: var(--texto-principal);">
                            <strong>Último inicio de sesión:</strong> {{ user.last_login|date:"d/m/Y, H:i" }}
                        </li>
                    </ul>

                    <div class="text-center mt-4">
                        <a href="#" class="btn" style="background-color: var(--acento-principal); color: var(--texto-principal);">
                            Editar Perfil (Próximamente)
                        </a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}

{% extends 'base/menu.html' %}
{% load static %}
{% block content %}

<link rel="stylesheet" href="{% static 'css/registro.css' %}">

<script type="module">
    import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    
    window.handleResetPassword = async function() {
        const email = document.getElementById('email').value;
        const auth = window.global_auth;
        const submitButton = document.getElementById('submitButton');

        if (!auth) {
            alert("Error: Firebase no cargó correctamente.");
            return;
        }

        submitButton.disabled = true;
        submitButton.textContent = 'Enviando...';

        try {
            await sendPasswordResetEmail(auth, email);
            alert(`Se ha enviado un correo a ${email} con las instrucciones.`);
            window.location.href = "{% url 'login' %}";
        } catch (error) {
            let msg = "Error desconocido.";
            if (error.code === 'auth/user-not-found') {
                msg = "No existe una cuenta con ese correo.";
            } else if (error.code === 'auth/invalid-email') {
                msg = "Correo electrónico inválido.";
            }
            alert(msg);
        } finally {
            submitButton.disabled = false;
            submitButton.textContent = 'Enviar enlace';
        }
    };
</script>

<div class="form-container" style="max-width: 400px; margin: 100px auto;">
    
    <div class="mt-auto text-center pt-5">
        <img src="{% static 'images/mascotasin.png' %}" 
             alt="Logo"
             class="img-fluid mb-2" 
             style="max-width: 250px; height: auto; opacity: 0.8;">
             
        <h3 class="fw-bold text-white">Recuperar Contraseña</h3>
        
        <p class="text-light opacity-75 small">
            Ingresa tu correo y te enviaremos un enlace para restablecerla.
        </p>
    </div>

    <form id="resetForm" novalidate>
        <div class="mb-4">
            <label for="email" class="form-label text-info fw-bold">Correo Electrónico</label>
            <input type="email" class="form-control" id="email" required placeholder="nombre@ejemplo.com">
        </div>

        <div class="d-grid">
            <button type="submit" class="btn btn-warning fw-bold py-2" id="submitButton" 
                    style="color: #0f1923;"> Enviar enlace de recuperación
            </button>
        </div>
    </form>
    
    <div class="text-center mt-4">
        <a href="{% url 'login' %}" class="text-decoration-none text-info small fw-bold">
            <i class="bi bi-arrow-left"></i> Volver al Inicio de Sesión
        </a>
    </div>
</div>

<script>
    document.getElementById('resetForm').addEventListener('submit', function(e) {
        e.preventDefault();
        if (typeof window.handleResetPassword === 'function') {
            window.handleResetPassword();
        }
    });
</script>

{% endblock %}

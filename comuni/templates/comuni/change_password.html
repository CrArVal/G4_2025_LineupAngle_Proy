{% extends 'base/menu.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/registro.css' %}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<script type="module">
    import { updatePassword, reauthenticateWithCredential, EmailAuthProvider } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    window.handleChangePassword = async function() {
        const currentPassword = document.getElementById('current_password').value;
        const newPassword = document.getElementById('new_password').value;
        const confirmPassword = document.getElementById('confirm_password').value;
        const submitButton = document.getElementById('submitButton');
        
        // Usamos la sesión global activa
        const user = window.global_auth.currentUser;

        if (!user) {
            alert("Error: No se detectó la sesión de Firebase. Recarga la página.");
            return;
        }

        // 1. Validaciones básicas
        if (newPassword !== confirmPassword) {
            document.getElementById('confirm_password').classList.add('is-invalid');
            return;
        }
        if (newPassword.length < 6) {
            alert("La nueva contraseña debe tener al menos 6 caracteres.");
            return;
        }

        submitButton.disabled = true;
        submitButton.textContent = 'Verificando y Actualizando...';

        try {
            // 2. RE-AUTENTICACIÓN (Paso de seguridad obligatorio de Firebase)
            // Creamos credenciales con el email actual y la contraseña que el usuario acaba de escribir
            const credential = EmailAuthProvider.credential(user.email, currentPassword);
            
            // Intentamos re-loguear internamente para confirmar que es el dueño
            await reauthenticateWithCredential(user, credential);

            // 3. Si pasó la re-autenticación, actualizamos la contraseña
            await updatePassword(user, newPassword);

            alert('¡Contraseña actualizada correctamente! Por favor inicia sesión de nuevo.');
            
            // 4. Cerramos sesión para forzar el re-login con la nueva clave
            document.querySelector('.logout-action').click(); 

        } catch (error) {
            console.error("Error al cambiar contraseña:", error);
            let msg = "Error desconocido.";

            if (error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                msg = "La contraseña actual es incorrecta.";
                document.getElementById('current_password').classList.add('is-invalid');
            } else if (error.code === 'auth/weak-password') {
                msg = "La nueva contraseña es muy débil.";
            } else if (error.code === 'auth/requires-recent-login') {
                msg = "Por seguridad, debes cerrar sesión y volver a entrar antes de cambiar tu clave.";
            }

            alert(msg);
        } finally {
            submitButton.disabled = false;
            submitButton.textContent = 'Cambiar Contraseña';
        }
    };
</script>

<div class="form-container" style="max-width: 500px; margin-top: 100px;">
    <div class="text-center mb-4">
        <h3 class="fw-bold text-white">Cambiar Contraseña</h3>
        <p class="text-muted small">Por seguridad, debes ingresar tu contraseña actual.</p>
    </div>

    <form id="changePassForm" novalidate>
        <div class="mb-4">
            <label class="form-label text-info fw-bold">Contraseña Actual</label>
            <div class="input-group">
                <input type="password" class="form-control" id="current_password" required>
                <button class="btn btn-outline-secondary" type="button" onclick="togglePass('current_password', 'icon1')">
                    <i class="bi bi-eye-slash" id="icon1"></i>
                </button>
                <div class="invalid-feedback">Contraseña incorrecta.</div>
            </div>
        </div>

        <hr class="border-secondary my-4">

        <div class="mb-3">
            <label class="form-label text-white">Nueva Contraseña</label>
            <div class="input-group">
                <input type="password" class="form-control" id="new_password" required minlength="6">
                <button class="btn btn-outline-secondary" type="button" onclick="togglePass('new_password', 'icon2')">
                    <i class="bi bi-eye-slash" id="icon2"></i>
                </button>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label text-white">Confirmar Nueva Contraseña</label>
            <div class="input-group">
                <input type="password" class="form-control" id="confirm_password" required>
                <button class="btn btn-outline-secondary" type="button" onclick="togglePass('confirm_password', 'icon2')">
                    <i class="bi bi-eye-slash" id="icon2"></i>
                </button>
                <div class="invalid-feedback">Las contraseñas no coinciden.</div>
            </div>
        </div>

        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-warning fw-bold" id="submitButton">
                Cambiar Contraseña
            </button>
            <a href="{% url 'home' %}" class="btn btn-outline-light">Cancelar</a>
        </div>
    </form>
</div>

<script>
    // Lógica para mostrar/ocultar contraseñas
    function togglePass(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);
        if (input.type === "password") {
            input.type = "text";
            icon.classList.replace("bi-eye-slash", "bi-eye");
        } else {
            input.type = "password";
            icon.classList.replace("bi-eye", "bi-eye-slash");
        }
    }

    // Listener del formulario
    document.getElementById('changePassForm').addEventListener('submit', function(e) {
        e.preventDefault();
        // Limpiar errores visuales previos
        document.querySelectorAll('.is-invalid').forEach(el => el.classList.remove('is-invalid'));
        
        if (typeof window.handleChangePassword === 'function') {
            window.handleChangePassword();
        }
    });
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
{% endblock %}

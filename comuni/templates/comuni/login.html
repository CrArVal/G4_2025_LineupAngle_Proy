{% extends 'base/menu.html' %}
{% load static %}
{% block content %}

<link rel="stylesheet" href="{% static 'css/registro.css' %}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<script type="module">
    import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    
    // ==========================================================
    // ⭐️ FUNCIÓN GLOBAL DE LOGIN CON FIREBASE ⭐️
    // ==========================================================
    window.handleFirebaseLogin = async function() {
        // Usamos la instancia global creada en el menú
        const auth = window.global_auth; 

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const submitButton = document.getElementById('submitButton');
        
        if (!auth) {
            alert("ERROR: La autenticación de Firebase no se cargó. Vuelve a cargar la página.");
            return;
        }

        submitButton.disabled = true;
        submitButton.textContent = 'Ingresando...';
        
        try {
            // 1. Iniciar sesión en Firebase
            const userCredential = await signInWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;

            // 2. Obtener Token y crear Cookie
            const idToken = await user.getIdToken(); 
            document.cookie = `firebaseToken=${idToken}; max-age=3600; path=/; secure; samesite=Lax`; 
            localStorage.setItem('firebaseToken', idToken);
            
            // 3. Redirigir al Home (Django leerá la cookie)
            window.location.href = "{% url 'home' %}";

        } catch (error) {
            let errorMessage = "Error desconocido.";
            if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                errorMessage = "Correo o contraseña incorrectos.";
            } else if (error.code === 'auth/invalid-email') {
                errorMessage = "El formato del correo electrónico es inválido.";
            } else if (error.code === 'auth/too-many-requests') {
                errorMessage = "Demasiados intentos fallidos. Inténtalo más tarde.";
            }
            
            alert(`Error al iniciar sesión: ${errorMessage}`);
            console.error("Firebase Login Error:", error);

        } finally {
            submitButton.disabled = false;
            submitButton.textContent = 'Ingresar';
        }
    };
</script>


<div class="form-container">
    <div class="mt-auto text-center pt-5">
        <img src="{% static 'images/mascotasinfondo.png' %}" 
             alt="Mascota LineupAngle" 
             style="max-width: 250px; height: auto; opacity: 0.8;">
    </div>
    <h2>Iniciar Sesión</h2>
    
    <form id="loginForm" class="needs-validation" novalidate>
        
        <div class="mb-3">
            <label for="email" class="form-label">Correo Electrónico</label>
            <input type="email" class="form-control" id="email" name="email" required>
            <div class="invalid-feedback">Por favor, ingresa un correo electrónico válido.</div>
        </div>

        <div class="mb-4">
            <label for="password" class="form-label">Contraseña</label>
            <div class="input-group">
                <input type="password" class="form-control" id="password" name="password" required minlength="6"> 
                <button class="btn btn-outline-secondary" type="button" id="togglePassword" style="border-color: var(--texto-secundario); color: var(--texto-secundario);">
                    <i class="bi bi-eye-slash" id="togglePasswordIcon"></i>
                </button>
                <div class="invalid-feedback">La contraseña debe tener al menos 6 caracteres.</div>
            </div>
        </div>
        
        <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg" id="submitButton" disabled
                    style="background-color: var(--acento-principal); border-color: var(--acento-principal);">
                Ingresar
            </button>
        </div>
    </form>
    
    <br>
    
    <div class="text-center mt-2">
        <a href="{% url 'forgot_password' %}" class="form-text text-secondary-accent text-decoration-none fw-bold">
            ¿Olvidaste tu contraseña?
        </a>
    </div>
        
    <div class="text-center mt-4">
        <small class="text-secondary-accent">¿No tienes una cuenta? <a href="{% url 'register' %}" class="fw-bold">Regístrate</a></small>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const loginForm = document.getElementById('loginForm');
        const submitButton = document.getElementById('submitButton');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        
        // --- Función de mostrar/ocultar contraseña ---
        function setupPasswordToggle(toggleId, inputId, iconId) {
             const toggleButton = document.getElementById(toggleId);
             const passwordInput = document.getElementById(inputId);
             const icon = document.getElementById(iconId);

             if (toggleButton) {
                 toggleButton.addEventListener('click', function () {
                     const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                     passwordInput.setAttribute('type', type);
                     if (type === 'text') {
                         icon.classList.remove('bi-eye-slash'); icon.classList.add('bi-eye');
                     } else {
                         icon.classList.remove('bi-eye'); icon.classList.add('bi-eye-slash');
                     }
                 });
             }
        }

        // --- Función de chequeo de validez ---
        function checkFormValidity() {
            const isNativeValid = loginForm.checkValidity();
            const password = passwordInput.value;
            const email = emailInput.value;
            
            // Validaciones extra: longitud mínima y email no vacío
            const isCustomValid = (password.length >= 6) && (email.trim() !== '');
            
            const isFormComplete = isNativeValid && isCustomValid;
            submitButton.disabled = !isFormComplete;
            return isFormComplete;
        }

        // Inicialización UX
        setupPasswordToggle('togglePassword', 'password', 'togglePasswordIcon');
        
        // Ejecución en tiempo real
        loginForm.addEventListener('keyup', checkFormValidity);
        loginForm.addEventListener('change', checkFormValidity);
        checkFormValidity();


        // 🚨 CONTROL DEL SUBMIT
        loginForm.addEventListener('submit', function(event) {
            event.preventDefault(); 
            event.stopPropagation();
            
            loginForm.classList.add('was-validated');

            if (checkFormValidity()) {
                // Llamada a la función global
                if (typeof window.handleFirebaseLogin === 'function') {
                    window.handleFirebaseLogin();
                } else {
                    alert('Error fatal: La lógica de Firebase no se cargó correctamente.');
                }
            }
        });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
{% endblock %}

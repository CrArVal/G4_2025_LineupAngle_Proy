{% extends 'base/menu.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/login_styles.css' %}">
<link rel="stylesheet" href="{% static 'css/login-register.css' %}"> <div class="form-container">
    <div class="mt-auto text-center pt-5">
        <img src="{% static 'images/mascotasinfondo.png' %}" 
             alt="Mascota LineupAngle" 
             style="max-width: 250px; height: auto; opacity: 0.8;">
    </div>
    <h2>Iniciar Sesión</h2>
    
    <form id="loginForm" class="needs-validation" novalidate method="POST">
        {% csrf_token %} <div class="mb-3">
            <label for="id_username" class="form-label">Nombre de Usuario</label>
            <input type="text" class="form-control" id="id_username" name="username" required>
            <div class="invalid-feedback">
                Por favor, ingresa tu nombre de usuario.
            </div>
        </div>

        <div class="mb-4">
            <label for="id_password" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="id_password" name="password" required>
            <div class="invalid-feedback">
                Por favor, ingresa tu contraseña.
            </div>
        </div>
        
        <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">Ingresar</button>
        </div>
    </form>
    
    <br>
    
    <div class="text-center mt-2">
        <a href="#" class="form-text text-secondary-accent text-decoration-none">
            ¿Olvidaste tu contraseña?
        </a>
    </div>
        
    <div class="text-center mt-4">
        <small class="text-secondary-accent">¿No tienes una cuenta? <a href="{% url 'registro' %}" class="fw-bold">Regístrate</a></small>
    </div>
</div>

<script>
    (function () {
        'use strict';
        const form = document.getElementById('loginForm');
        form.addEventListener('submit', function (event) {
            if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
            }
            form.classList.add('was-validated');
        }, false);
    })();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
{% endblock %}

    {% include "base/menu.html" %}

    <!-- Contenido dinámico -->
     <main class="container-fluid" style="margin-top: 100px;">
    {% block content %}
  <style>
    :root {
      --dark-bg: #0d0f14;
      --primary-color: #ff385c;
      --secondary-color: #1e1f26;
      --text-light: #f5f5f5;
      --text-muted: #b0b0b0;
    }

    body {
      background-color: var(--dark-bg);
      color: var(--text-light);
    }

    .navbar {
      background-color: var(--secondary-color);
    }
    .navbar-brand {
      color: var(--primary-color);
      font-weight: bold;
    }
    .navbar-brand:hover {
      color: var(--text-light);
    }
    a.nav-link {
      color: var(--text-light);
    }
    a.nav-link:hover {
      color: var(--primary-color);
    }

    .gallery-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      cursor: pointer;
      transition: transform 0.3s ease;
      border: 2px solid transparent;
    }
    .gallery-img:hover {
      transform: scale(1.05);
      border-color: var(--primary-color);
    }

    .modal-img {
      width: 100%;
      height: 300px;
      object-fit: cover;
    }

    .modal-body {
      display: flex;
      gap: 20px;
    }
    @media (max-width: 768px) {
      .modal-body {
        flex-direction: column;
      }
    }

    .modal-content {
      background-color: var(--secondary-color);
      color: var(--text-light);
    }
    .modal-header .btn-close {
      filter: invert(1);
    }

    .section-title {
      color: var(--primary-color);
      margin-bottom: 2rem;
    }

    .btn-primary {
      background-color: var(--primary-color);
      border-color: var(--primary-color);
    }
    .btn-primary:hover {
      background-color: #e02e52;
      border-color: #e02e52;
    }

    /* Ocultar columnas que no coinciden con filtro */
    .lineup-item {
      display: block;
    }
  </style>
</head>
<body>

 

  <div class="container py-5">
    <h2 class="section-title text-center">Lineups Destacados</h2>

    <!-- BARRA DE BÚSQUEDA -->
    <div class="row justify-content-center mb-4">
      <div class="col-md-6">
        <div class="input-group">
          <input type="text" id="searchInput" class="form-control" placeholder="Buscar (ej: Sova, Viper...)">
          <span class="input-group-text bg-primary text-white"><i class="bi bi-search"></i></span>
        </div>
      </div>
    </div>

    <!-- GALERÍA -->
    <div class="row g-3" id="gallery">
      <!-- Cada div.col-md-4 tiene atributo data-title para filtrar -->
      <div class="col-md-4 lineup-item" data-title="Sova Haven">
        <img src="https://lineupsvalorant.com/static/lineup_images/327/1.webp"
             class="gallery-img img-thumbnail"
             alt="Sova Haven"
             data-bs-toggle="modal" data-bs-target="#lineupModal"
             data-title="Sova Haven"
             data-description="Línea para evitar el defuse desde C Long con Sova."
             data-images='["https://lineupsvalorant.com/static/lineup_images/327/1.webp",
                            "https://lineupsvalorant.com/static/lineup_images/327/2.webp",
                            "https://lineupsvalorant.com/static/lineup_images/327/3.webp"]'>
      </div>
      <div class="col-md-4 lineup-item" data-title="Viper Bind">
        <img src="https://lineupsvalorant.com/static/lineup_images/327/2.webp"
             class="gallery-img img-thumbnail"
             alt="Viper Bind"
             data-bs-toggle="modal" data-bs-target="#lineupModal"
             data-title="Viper Bind"
             data-description="Línea post-plant con Viper desde A Lobby."
             data-images='["https://lineupsvalorant.com/static/lineup_images/327/2.webp",
                            "https://lineupsvalorant.com/static/lineup_images/327/1.webp",
                            "https://lineupsvalorant.com/static/lineup_images/327/3.webp"]'>
      </div>
      <div class="col-md-4 lineup-item" data-title="Killjoy Ascent">
        <img src="https://lineupsvalorant.com/static/lineup_images/327/3.webp"
             class="gallery-img img-thumbnail"
             alt="Killjoy Ascent"
             data-bs-toggle="modal" data-bs-target="#lineupModal"
             data-title="Killjoy Ascent"
             data-description="Línea con Killjoy desde Catwalk hacia Tree."
             data-images='["https://lineupsvalorant.com/static/lineup_images/327/3.webp",
                            "https://lineupsvalorant.com/static/lineup_images/327/2.webp",
                            "https://lineupsvalorant.com/static/lineup_images/327/1.webp"]'>
      </div>
      <!-- Puedes agregar más imágenes con su data-title, data-description, data-images -->
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal fade" id="lineupModal" tabindex="-1" aria-labelledby="lineupModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0">
          <h5 class="modal-title" id="modalTitle">Lineup</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="carouselLineup" class="carousel slide w-50" data-bs-ride="carousel">
            <div class="carousel-inner" id="carouselInner">
              <!-- las imágenes del carrusel se generarán dinámicamente -->
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselLineup" data-bs-slide="prev">
              <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselLineup" data-bs-slide="next">
              <span class="carousel-control-next-icon"></span>
            </button>
          </div>
          <div class="w-50 ps-3">
            <h5>Descripción</h5>
            <p id="modalDescription">Aquí irá la descripción de la línea.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Función para actualizar el modal con la imagen clicada
    const lineupModal = document.getElementById('lineupModal');
    lineupModal.addEventListener('show.bs.modal', function (event) {
      const img = event.relatedTarget; // la imagen que disparó el modal
      const title = img.getAttribute('data-title');
      const description = img.getAttribute('data-description');
      const images = JSON.parse(img.getAttribute('data-images'));

      // Actualiza título
      document.getElementById('modalTitle').textContent = title;

      // Actualiza descripción
      document.getElementById('modalDescription').textContent = description;

      // Construir carrusel dinámico
      const carouselInner = document.getElementById('carouselInner');
      carouselInner.innerHTML = ''; // limpiar

      images.forEach((src, index) => {
        const divItem = document.createElement('div');
        divItem.classList.add('carousel-item');
        if (index === 0) {
          divItem.classList.add('active');
        }
        const imgEl = document.createElement('img');
        imgEl.classList.add('d-block', 'modal-img');
        imgEl.src = src;
        divItem.appendChild(imgEl);
        carouselInner.appendChild(divItem);
      });
    });

    // Filtro de búsqueda (lupa)
    document.getElementById('searchInput').addEventListener('input', function () {
      const query = this.value.toLowerCase();
      document.querySelectorAll('.lineup-item').forEach(item => {
        const title = item.getAttribute('data-title').toLowerCase();
        if (title.includes(query)) {
          item.style.display = 'block';
        } else {
          item.style.display = 'none';
        }
      });
    });
  </script>

</body>
</html>
    {% endblock %}
